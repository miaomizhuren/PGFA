# Seed-2026 paired feature-loss ablation.  Its base protocol mirrors the
# historical Full PGFA seed-2026 run; only loss_variant is intentionally changed.
experiment:
  name: pgfa_feature_alignment_seed2026
  seed: 2026
  output_dir: outputs/pgfa_feature_loss_ablation_seed2026/feature_alignment_seed2026
  log_path: experiments/logs/pgfa_feature_loss_ablation_seed2026/pgfa_feature_alignment_seed2026.log
dataset: {name: cifar10, root: ./datasets, num_classes: 10, download: false}
partition: {type: iid, num_clients: 100}
model: {name: resnet18}
federated: {num_rounds: 3700, total_rounds: 3700, clients_per_round: 10, local_epochs: 3, malicious_local_epochs: 3}
training: {batch_size: 64, learning_rate: 0.010, momentum: 0.9, weight_decay: 0.0005, num_workers: 0}
device: {type: auto}
tracking: {enabled: true, database_name: metrics_pgfa_feature_alignment_seed2026.db, record_client_metrics: true}
resume:
  enabled: true
  checkpoint_path: outputs/clean_resume_force_clean500_to3000_bs64_e3_save500/checkpoints/global_round_3000.pt
  resume_round: 3000
  # Historical Full PGFA seed-2026 starts its sampler afresh at R3001.
  # This exact setting reproduces its recorded selections; replay=true does not.
  replay_client_sampling: false
  replay_client_sampling_start_round: 1
checkpoint: {enabled: true, save_rounds: [3200, 3300, 3400, 3500, 3600, 3700], save_global_model: true, save_adversarial_delta: true}
defense: {enabled: false, name: none}
visualization: {enabled: false}
attack:
  enabled: true
  method: proto_uap
  target_label: 0
  malicious_client_ids: [0, 1, 2]
  num_malicious_clients: 3
  selection_policy: force_during_attack
  min_malicious_per_attack_round: 3
  prototype_build_policy: legacy_local
  poison_ratio: 0.60
  start_round: 3001
  end_round: 3200
  trigger:
    type: adversarial
    adversarial:
      epsilon: 0.10
      steps: 100
      alpha: 0.005
      prototype_contrastive:
        enabled: true
        use_in_delta_generation: true
        use_in_malicious_training: true
        lambda_delta: 12.0
        lambda_train: 7.0
        temperature: 0.01
        center_batches: 30
        mode: target_vs_source
        loss_variant: feature_alignment
        source_margin: 0.7
        feature_layer: layer4
        min_samples_per_class: 1
        missing_class_strategy: skip
        exclude_target_in_uap: true
        prototype_source: single_malicious
        aggregate_prototypes: false
        freeze_after_build: true
        refresh_policy: fixed
        refresh_interval: 5
        refresh_during: attack_only
evaluation: {post_attack_start: 3201, pa_auc_start: 3201, pa_auc_end: 3700, eval_rounds: [3001, 3100, 3200, 3201, 3300, 3400, 3500, 3600, 3700]}
mechanism_analysis: {enabled: false}
